<!doctype html><html lang='pt-br'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Minha Saúde</title><link rel='manifest' href='manifest.json'><style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#efefef;margin:0}
header{background:#1f766e;color:#fff;padding:28px} .card{background:#fff;margin:18px;border-radius:18px;padding:18px}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}
input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:10px}
button{background:#1f766e;color:#fff;border:none;padding:12px 18px;border-radius:12px}
</style><body><header><h1>Minha Saúde</h1><p>Histórico de exames • Flávia</p></header>
<div class='card'><h2>Resumo</h2><p>Peso atual: <b id=p></b> kg • Meta: <b id=m></b> kg</p></div>
<div class='card'><h2>Linha do tempo</h2><table><thead><tr><th>Data</th><th>Peso</th><th>LDL</th><th>HDL</th><th>Total</th><th>Glicose</th><th>HbA1c</th></tr></thead><tbody id=t></tbody></table></div>
<div class='card'><h2>Novo registro</h2><input id=d placeholder='AAAA-MM'><input id=w placeholder='Peso'><input id=l placeholder='LDL'><input id=h placeholder='HDL'><input id=tc placeholder='Total'><input id=g placeholder='Glicose'><input id=a placeholder='HbA1c'><button onclick='add()'>Salvar</button></div>
<script>
fetch('data.json').then(r=>r.json()).then(db=>{window.db=db;render()});
function render(){p.textContent=db.pesoAtual;m.textContent=db.metaPeso;t.innerHTML='';db.historico.forEach(r=>t.innerHTML+=`<tr><td>${r.data}</td><td>${r.peso??'-'}</td><td>${r.ldl??'-'}</td><td>${r.hdl??'-'}</td><td>${r.total??'-'}</td><td>${r.glicose??'-'}</td><td>${r.hba1c??'-'}</td></tr>`)}
function add(){db.historico.push({data:d.value,peso:+w.value||null,ldl:+l.value||null,hdl:+h.value||null,total:+tc.value||null,glicose:+g.value||null,hba1c:+a.value||null});db.historico.sort((x,y)=>x.data.localeCompare(y.data));render();alert('Registro salvo neste dispositivo. Depois exportaremos sincronização.')}
</script></body></html>
