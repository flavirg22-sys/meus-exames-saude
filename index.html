<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Minha Saúde</title>
<link rel='manifest' href='manifest.json'>
<style>
body{font-family:-apple-system,Arial;background:#f6f7f9;margin:0}header{background:#0f766e;color:#fff;padding:22px}
.card{background:#fff;margin:14px;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}
button{background:#0f766e;color:#fff;border:0;border-radius:10px;padding:12px 16px}
input{width:100%;padding:10px;margin:6px 0}
</style></head><body>
<header><h2>Minha Saúde</h2><div>Histórico de exames • Flávia</div></header>
<div class='card'><h3>Resumo</h3><div>Peso atual: <b>58,5 kg</b> • Meta: <b>53 kg</b></div></div>
<div class='card'><h3>Linha do tempo</h3><table id=t></table></div>
<div class='card'><h3>Novo registro</h3>
<input id=d placeholder='Data (2026-09)'><input id=p placeholder='Peso (kg)'><button onclick='add()'>Salvar</button></div>
<script>
let data=[];fetch('data.json').then(r=>r.json()).then(j=>{data=j;render()});
function render(){let h='<tr><th>Data</th><th>Peso</th><th>LDL</th><th>Total</th></tr>';data.forEach(x=>h+=`<tr><td>${x.date}</td><td>${x.weight??'-'}</td><td>${x.ldl??'-'}</td><td>${x.total??'-'}</td></tr>`);t.innerHTML=h}
function add(){data.push({date:d.value,weight:parseFloat(p.value)});localStorage.setItem('extra',JSON.stringify(data.slice(6)));render()}
const e=JSON.parse(localStorage.getItem('extra')||'[]'); if(e.length){data=data.concat(e);}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script></body></html>
